name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    paths:
      - 'backend/schema.sql'
      - 'backend/src/db/migrations/**'

jobs:
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PostgreSQL Client
      run: sudo apt-get install -y postgresql-client

    - name: Determine Database URL
      id: db-url
      run: |
        if [ "${{ github.event.inputs.environment || 'production' }}" = "staging" ]; then
          echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_OUTPUT
        else
          echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_OUTPUT
        fi

    - name: Run Schema Migration
      env:
        DATABASE_URL: ${{ steps.db-url.outputs.DATABASE_URL }}
      run: |
        echo "Running database migrations for ${{ github.event.inputs.environment || 'production' }} environment..."
        
        # Test database connection
        psql "$DATABASE_URL" -c "SELECT version();" || {
          echo "❌ Cannot connect to database"
          exit 1
        }
        
        # Run main schema
        echo "Applying main schema..."
        psql "$DATABASE_URL" -f backend/schema.sql
        
        # Run migrations if any
        if [ -d "backend/src/db/migrations" ]; then
          echo "Running additional migrations..."
          for migration in $(ls backend/src/db/migrations/*.sql | sort); do
            echo "Applying: $(basename $migration)"
            psql "$DATABASE_URL" -f "$migration"
          done
        fi
        
        echo "✅ Database migration completed"

    - name: Verify Database
      env:
        DATABASE_URL: ${{ steps.db-url.outputs.DATABASE_URL }}
      run: |
        echo "Verifying database structure..."
        psql "$DATABASE_URL" -c "\dt"
        psql "$DATABASE_URL" -c "SELECT COUNT(*) as total_pastes FROM pastes;"
        psql "$DATABASE_URL" -c "SELECT id, created_at FROM pastes ORDER BY created_at DESC LIMIT 5;"

    - name: Create Migration Report
      env:
        DATABASE_URL: ${{ steps.db-url.outputs.DATABASE_URL }}
      run: |
        REPORT_FILE="migration-report-$(date +%Y%m%d-%H%M%S).txt"
        
        {
          echo "Database Migration Report"
          echo "========================="
          echo "Date: $(date)"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Tables:"
          psql "$DATABASE_URL" -c "\dt"
          echo ""
          echo "Paste Count:"
          psql "$DATABASE_URL" -c "SELECT COUNT(*) as total_pastes FROM pastes;"
          echo ""
          echo "Recent Pastes:"
          psql "$DATABASE_URL" -c "SELECT id, created_at, expires_at FROM pastes ORDER BY created_at DESC LIMIT 10;"
        } > "$REPORT_FILE"
        
        echo "REPORT_FILE=$REPORT_FILE" >> $GITHUB_ENV

    - name: Upload Migration Report
      uses: actions/upload-artifact@v4
      with:
        name: migration-report
        path: ${{ env.REPORT_FILE }}
        retention-days: 30