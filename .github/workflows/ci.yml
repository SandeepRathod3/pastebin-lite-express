name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pastebin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Wait for PostgreSQL
      run: |
        for i in {1..10}; do
          if pg_isready -h localhost -p 5432; then
            echo "✅ PostgreSQL is ready"
            break
          fi
          echo "⏳ Waiting for PostgreSQL... ($i/10)"
          sleep 3
        done

    - name: Create test database
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE pastebin_test;"
        PGPASSWORD=postgres psql -h localhost -U postgres -d pastebin_test -c "SELECT 1;"

    - name: Run backend linting
      working-directory: ./backend
      run: |
        if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
          npm run lint || exit 1
        else
          echo "No linting configured"
        fi

    - name: Run backend tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pastebin_test
        NODE_ENV: test
      run: |
        if [ -f package.json ] && grep -q '"test"' package.json; then
          npm test
        else
          echo "No tests configured"
        fi

    - name: Build backend
      working-directory: ./backend
      run: |
        if [ -f package.json ] && grep -q '"build"' package.json; then
          npm run build
        else
          echo "No build step required"
        fi

  # Frontend CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linting
      working-directory: ./frontend
      run: |
        if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
          npm run lint || exit 1
        else
          echo "No linting configured"
        fi

    - name: Type check (if TypeScript)
      working-directory: ./frontend
      run: |
        if [ -f tsconfig.json ]; then
          npx tsc --noEmit
        else
          echo "No TypeScript configured"
        fi

    - name: Run frontend tests
      working-directory: ./frontend
      run: |
        if [ -f package.json ] && grep -q '"test"' package.json; then
          npm test -- --passWithNoTests
        else
          echo "No tests configured"
        fi

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 7

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pastebin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start backend server
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pastebin_test
        PORT: 5000
      run: |
        npm ci
        npm run dev &
        sleep 10  # Wait for server to start

    - name: Run API tests
      run: |
        # Test health endpoint
        curl -f http://localhost:5000/api/healthz || exit 1
        
        # Test paste creation
        curl -X POST http://localhost:5000/api/pastes \
          -H "Content-Type: application/json" \
          -d '{"content": "Test paste"}' \
          --fail-with-body || exit 1

    - name: Cleanup
      if: always()
      run: pkill -f "node.*server.js" || true