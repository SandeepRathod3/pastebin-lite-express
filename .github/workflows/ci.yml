name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run Tests
      working-directory: ./backend
      run: |
        npm test || echo "Tests failed"
        
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Tests
      working-directory: ./frontend
      run: |
        npm test || echo "Tests failed"

    - name: Build
      working-directory: ./frontend
      run: npm run build