name: Deploy Frontend (Vercel)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      backend-url:
        required: true
        type: string
    outputs:
      frontend-url:
        description: 'Frontend URL'
        value: ${{ jobs.deploy.outputs.frontend-url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      frontend-url: ${{ steps.deploy.outputs.frontend-url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Vercel CLI
      run: npm install -g vercel

    - name: Create Environment File
      working-directory: ./frontend
      run: |
        # Set API URL for frontend
        echo "VITE_API_URL=${{ inputs.backend-url }}/api" > .env.production
        echo "✅ Created .env.production"

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
        echo "✅ Frontend built"

    - name: Deploy to Vercel
      id: deploy
      working-directory: ./frontend
      run: |
        # Deploy to Vercel
        DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
        
        echo "frontend-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        echo "FRONTEND_URL=$DEPLOY_URL" >> $GITHUB_ENV
        
        echo "✅ Deployed to: $DEPLOY_URL"