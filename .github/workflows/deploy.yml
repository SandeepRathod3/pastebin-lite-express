name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations'
        required: false
        default: false
        type: boolean

jobs:
  # -----------------------------------------------------------
  # Testing Phase
  # -----------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run Tests
      working-directory: ./backend
      run: npm test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Tests
      working-directory: ./frontend
      run: npm test

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

  # -----------------------------------------------------------
  # Database Migrations (Optional)
  # -----------------------------------------------------------
  migrate-database:
    name: Database Migrations
    if: github.event.inputs.run_migrations == true
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    environment: production
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PostgreSQL Client
      run: sudo apt-get install -y postgresql-client

    - name: Run Migrations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Running database migrations..."
        
        # Test database connection
        if ! psql "$DATABASE_URL" -c "SELECT version();"; then
          echo "❌ Cannot connect to database"
          exit 1
        fi
        
        # Run main schema if exists
        if [ -f "backend/schema.sql" ]; then
          echo "Applying main schema..."
          psql "$DATABASE_URL" -f backend/schema.sql
        fi
        
        # Run migrations if any
        if [ -d "backend/src/db/migrations" ]; then
          echo "Running additional migrations..."
          for migration in $(ls backend/src/db/migrations/*.sql | sort); do
            echo "Applying: $(basename $migration)"
            psql "$DATABASE_URL" -f "$migration"
          done
        fi
        
        echo "✅ Database migration completed"

    - name: Verify Database
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Verifying database structure..."
        psql "$DATABASE_URL" -c "\dt"

  # -----------------------------------------------------------
  # Backend Deployment (Render)
  # -----------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    outputs:
      backend-url: ${{ steps.save-url.outputs.backend-url }}
    
    steps:
    - name: Trigger Render Deployment
      run: |
        echo "🚀 Triggering Render deployment..."
        
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"
        
        echo "✅ Deployment triggered"

    - name: Save Backend URL
      id: save-url
      run: |
        echo "backend-url=${{ secrets.RENDER_BACKEND_URL }}" >> $GITHUB_OUTPUT
        echo "Backend URL: ${{ secrets.RENDER_BACKEND_URL }}"

  # -----------------------------------------------------------
  # Frontend Deployment (Vercel)
  # -----------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    outputs:
      frontend-url: ${{ steps.deploy.outputs.frontend-url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Vercel CLI
      run: npm install -g vercel

    - name: Create Environment File
      working-directory: ./frontend
      run: |
        echo "VITE_API_URL=${{ needs.deploy-backend.outputs.backend-url }}/api" > .env.production
        echo "✅ Created .env.production"

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
        echo "✅ Frontend built"

    - name: Deploy to Vercel
      id: deploy
      working-directory: ./frontend
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        # Deploy to Vercel production
        DEPLOY_OUTPUT=$(vercel deploy --prod --token=$VERCEL_TOKEN --yes 2>&1)
        
        # Extract URL from Vercel output
        FRONTEND_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.vercel\.app' | head -1)
        
        if [ -z "$FRONTEND_URL" ]; then
          FRONTEND_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo '(https?://[^[:space:]]+)' | head -1)
        fi
        
        echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
        echo "✅ Deployed to: $FRONTEND_URL"

  # -----------------------------------------------------------
  # Verification
  # -----------------------------------------------------------
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    
    steps:
    - name: Wait for Backend
      run: |
        echo "Waiting for backend to be ready..."
        
        for i in {1..20}; do
          if curl -s -f "${{ needs.deploy-backend.outputs.backend-url }}/health" > /dev/null; then
            echo "✅ Backend is up!"
            break
          fi
          
          if [ $i -eq 20 ]; then
            echo "⚠️ Backend taking longer than expected to start"
          fi
          
          echo "Waiting... ($i/20)"
          sleep 10
        done

    - name: Test Backend
      run: |
        echo "Testing backend at: ${{ needs.deploy-backend.outputs.backend-url }}"
        
        curl -f "${{ needs.deploy-backend.outputs.backend-url }}/health" && \
        echo "✅ Backend is healthy" || \
        echo "⚠️ Backend health check failed"

    - name: Test Frontend
      run: |
        echo "Testing frontend at: ${{ needs.deploy-frontend.outputs.frontend-url }}"
        
        if curl -s -f "${{ needs.deploy-frontend.outputs.frontend-url }}" > /dev/null; then
          echo "✅ Frontend is accessible"
        else
          echo "⚠️ Frontend may have issues"
        fi

    - name: Create Summary
      run: |
        echo "## 🚀 Deployment Complete" > summary.md
        echo "" >> summary.md
        echo "**Frontend**: ${{ needs.deploy-frontend.outputs.frontend-url }}" >> summary.md
        echo "**Backend**: ${{ needs.deploy-backend.outputs.backend-url }}" >> summary.md
        echo "**Database**: Neon PostgreSQL" >> summary.md
        echo "**Time**: $(date)" >> summary.md
        echo "" >> summary.md
        echo "### Testing Links" >> summary.md
        echo "- [Frontend](${{ needs.deploy-frontend.outputs.frontend-url }})" >> summary.md
        echo "- [Backend Health](${{ needs.deploy-backend.outputs.backend-url }}/health)" >> summary.md
        echo "- [Backend API](${{ needs.deploy-backend.outputs.backend-url }}/api)" >> summary.md

    - name: Upload Summary
      uses: actions/upload-artifact@v4
      with:
        name: deployment-summary
        path: summary.md