name: Verify Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      backend-url:
        required: true
        type: string
      frontend-url:
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test Backend
      run: |
        echo "Testing backend at: ${{ inputs.backend-url }}"
        
        # Wait for backend to be ready
        for i in {1..10}; do
          if curl -f "${{ inputs.backend-url }}/health" > /dev/null 2>&1; then
            echo "✅ Backend is up!"
            break
          fi
          echo "Waiting... ($i/10)"
          sleep 5
        done
        
        # Final test
        curl -f "${{ inputs.backend-url }}/health" || echo "⚠️ Backend may have issues"

    - name: Test Frontend
      run: |
        echo "Testing frontend at: ${{ inputs.frontend-url }}"
        
        # Check if frontend loads
        if curl -f "${{ inputs.frontend-url }}" > /dev/null 2>&1; then
          echo "✅ Frontend is accessible"
        else
          echo "⚠️ Frontend may have issues"
        fi

    - name: Send Success Notification
      if: success()
      run: |
        echo "🚀 Deployment Successful!"
        echo "Frontend: ${{ inputs.frontend-url }}"
        echo "Backend: ${{ inputs.backend-url }}"
        echo "Environment: ${{ inputs.environment }}"